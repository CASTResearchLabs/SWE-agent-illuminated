# Documentation Task Configuration
# Generate architectural overview without MCP structural analysis
target_repo: https://github.com/CASTResearchLabs/openmrs-core
model: anthropic/claude-sonnet-4-6
per_instance_cost_limit: 10.0
per_instance_call_limit: 500
config: config/adaptive_engineering.yaml
deployment: local
application_name: openmrs01

task: |
  Provide architectural overview of the code base, 
  saving intermediate findings in markup files if needed, 
  then writing the final overview in ARCHITECTURE.md file. 
  Overview should include an analysis of API/UI endpoints, 
  of data entities and their call graphs, quality insights, ... 
  
  **DELIVERABLES (MUST CREATE FILES):**
  - Save intermediate findings in markup files in <repository directory>/ if needed
  - CREATE and SAVE the final overview in a file named and SAVE <repository directory>/ARCHITECTURE.md
  
  Be as specific and detailed as possible in the files you create.