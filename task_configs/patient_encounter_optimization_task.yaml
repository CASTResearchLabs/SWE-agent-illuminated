# Patient-Encounter Performance Optimization Task Configuration
# Optimize encounter processing while preserving patient data integrity 
target_repo: https://github.com/CASTResearchLabs/openmrs-core
model: anthropic/claude-sonnet-4-6
per_instance_cost_limit: 10.0
per_instance_call_limit: 500
config: config/adaptive_engineering.yaml
deployment: local
application_name: openmrs01

task: |
  **PERFORMANCE ISSUE:** 
  Clinical staff report that encounter record retrieval has become unacceptably slow, 
  especially when viewing patient encounter histories. Initial investigation suggests 
  performance bottlenecks in encounter-related database operations and API endpoints.

  **OPTIMIZATION OBJECTIVE:**
  Use structural analysis to identify root causes of encounter performance issues and 
  design targeted optimizations that improve response times while preserving data integrity.

  **ANALYSIS APPROACH:**

  **Phase 1: Performance Bottleneck Discovery**
  1. Identify encounter-related database operations and assess their complexity
  2. Map all API endpoints and transactions that retrieve or process encounter data
  3. Analyze encounter-related call graphs to find computational hotspots
  4. Assess encounter table data access patterns and potential SQL performance issues

  **Phase 2: Cross-Entity Impact Analysis**  
  1. Examine patient-encounter relationships and shared database operations
  2. Identify code objects used by both patient and encounter processing workflows
  3. Map transaction intersections between patient management and encounter handling
  4. Assess which optimizations might affect patient data consistency or workflows

  **Phase 3: Code Quality and Structural Issues**
  1. Identify encounter-related code with high complexity or performance anti-patterns
  2. Find quality issues (SQL in loops, inefficient queries, excessive object creation)
  3. Analyze coupling between encounter processing and other system components
  4. Assess architectural patterns that contribute to performance degradation

  **Phase 4: Optimization Strategy Design**
  1. Prioritize performance improvements by impact and implementation complexity
  2. Design caching strategies for frequently accessed encounter data
  3. Identify database indexing opportunities and query optimization targets  
  4. Plan refactoring approach that minimizes disruption to clinical workflows

  **Phase 5: Testing and Validation Scope**
  1. Map all transactions requiring performance testing after optimization
  2. Identify critical patient care workflows that must be regression tested
  3. Define performance benchmarks and success criteria
  4. Plan rollout strategy with fallback procedures for clinical environments

  **DELIVERABLES (MUST CREATE FILES):**
  - **ENCOUNTER_PERFORMANCE_BOTTLENECKS.md** - Root cause analysis of slow operations
  - **CROSS_ENTITY_DEPENDENCY_ANALYSIS.md** - Patient-encounter relationship impacts  
  - **CODE_QUALITY_ISSUES.md** - Structural problems contributing to poor performance
  - **OPTIMIZATION_STRATEGY.md** - Prioritized performance improvement plan
  - **PERFORMANCE_TESTING_SCOPE.md** - Testing requirements for clinical workflow validation

  **SUCCESS METRICS:**
  - Identify specific code files, methods, and database operations causing slowdowns
  - Quantify encounter-related transaction complexity and call graph depth
  - Map precise coupling points between patient and encounter processing
  - Deliver actionable optimization plan with measurable performance targets

