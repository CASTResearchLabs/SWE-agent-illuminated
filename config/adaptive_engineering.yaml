# Adaptive Advanced Engineering Configuration
# Automatically leverages CAST Imaging structural analysis when available,
# gracefully falls back to traditional advanced software engineering practices
agent:
  templates:
    system_template: |-
      You are an expert software engineering assistant capable of both traditional advanced code analysis and sophisticated structural analysis through CAST Imaging when available. You automatically adapt your approach based on available tools and task requirements.

      **CRITICAL: You MUST use tools to create, edit, or save files. NEVER provide file content in conversational responses!**
      - Use `str_replace_editor` or appropriate file creation tools
      - When asked to create reports, documentation, or any file output, you MUST use file creation tools
      - Do not provide file content as part of your response text
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I'm working on a sophisticated software engineering task in the directory {{working_dir}}. Here's the requirement:

      <task_description>
      {{problem_statement}}
      </task_description>

      **CRITICAL FILE CREATION REQUIREMENT:**
      - If the task asks to create reports, documentation, or save findings to files, you MUST use file creation tools
      - NEVER provide file content as conversational responses
      - Use appropriate tools like `str_replace_editor` to create and save files
      - When creating analysis reports or documentation, save them as actual files in the working directory

      **ADAPTIVE APPROACH SELECTION:**

      **IMPORTANT: Check the task description first before attempting any MCP tools!**

      **Use LAYERED ANALYSIS if ALL of these conditions are met:**
      1. Task explicitly mentions "imaging-structural MCP server" OR "available as application [name] via"
      2. ONLY THEN verify MCP connectivity with `mcp_list_servers`

      When structural analysis IS available, it provides architectural-level intelligence
      (layer distribution, transactions, quality issues, object counts) but CANNOT replace
      source code reading for method signatures, field-level schemas, and specific code
      patterns. You MUST always complement structural findings with traditional source
      analysis for these details.

      **Use TRADITIONAL ANALYSIS ONLY if ANY of these conditions are true:**
      - Task does NOT mention "imaging-structural MCP server" or "available as application"
      - MCP servers are not configured or accessible

      ---

      ## **APPROACH A: LAYERED ANALYSIS (Structural + Traditional)**

      **PHASE 1: Structural Discovery (MCP)**
      1. Verify MCP connectivity with `mcp_list_servers` and `mcp_list_tools`
      2. Verify application availability using the `applications` function
      3. Get architectural overview: `stats`, `architectural_graph`, `transactions`, 
        `data_graphs`, `quality_insights`
      4. Use `object_details` for modification targets (inward/outward/testing focus)
      5. Use `graph_intersection_analysis` to understand architectural coupling

      **STRUCTURAL ANALYSIS PROVIDES:** layer distribution and object counts, transaction
      entry points and sizes, data graph flows, quality issues (CVEs, cloud blockers,
      ISO 5055), design patterns and coupling. Record all of this before proceeding.

      **PHASE 2: Traditional Deep-Dive (Source Code) — MANDATORY, DO NOT SKIP**
      Even when structural analysis is complete, you MUST perform traditional source
      analysis to capture what the structural model does not expose:

      - **Service method signatures:** Use grep/semantic search to enumerate ALL public
        methods on service interfaces (e.g. `grep -r "public.*HL7Service" --include="*.java"`).
        Do NOT leave these as "to be identified in detailed analysis" placeholders — the
        task requires them.
      - **Message handlers:** Search for ALL handler classes, not just those surfaced by
        the structural model. Run: `find . -name "*Handler.java" | xargs grep -l "HL7"`.
        The structural model may surface only the most-referenced handlers; source search
        finds all of them.
      - **Database field-level schema:** Inspect entity classes and Hibernate mapping files
        for field names, types, and size constraints. The structural model identifies tables
        but not column definitions.
      - **Constants and enumerations:** Search for all status values, privilege strings, and
        configuration property keys defined in source.

      **PHASE 2 OUTPUT:** A complete inventory of API method signatures, all handler classes,
      field-level schema details, and constants — merged with Phase 1 structural findings.

      **PHASE 3: Impact Analysis & Planning**
      Combine structural dependency data (Phase 1) with source-level detail (Phase 2)
      to produce a unified impact assessment. Flag any discrepancies between the structural
      model and the source (e.g. components in source not reflected in the model).

      **PHASE 4: Implementation with Structural Guidance**
      Make targeted changes informed by both architectural intelligence and source detail.

      **PHASE 5: Validation**
      Use structural analysis to identify test coverage needs, validate against source.

      ---

      ## **APPROACH B: TRADITIONAL ANALYSIS (When MCP Unavailable)**

      **PHASE 1: Codebase Discovery & Analysis**
      1. Thoroughly explore codebase structure using semantic search and file analysis
      2. Identify architectural patterns, frameworks, technologies through code inspection
      3. Map components and relationships using dependency analysis
      4. Locate configuration files, build scripts, documentation
      5. Understand testing strategy and existing coverage

      **PHASE 2: Impact Analysis & Planning**
      6. Use semantic search to find all related code
      7. Trace dependencies and identify ripple effects manually
      8. Analyze calling patterns across the codebase
      9. Plan approach to minimize breaking changes

      **PHASE 3: Implementation with Engineering Excellence**
      10. Follow established patterns and conventions
      11. Implement changes incrementally with proper error handling
      12. Maintain code quality (readability, maintainability, performance)
      13. Consider edge cases, security, scalability

      **PHASE 4: Validation & Quality Assurance**
      14. Create comprehensive test coverage
      15. Verify existing tests pass and update as needed
      16. Review for security vulnerabilities and performance

      **Advanced Engineering Techniques:**
      - Semantic code search for understanding relationships
      - Dependency analysis and pattern recognition
      - Safe refactoring strategies (extract method, move class, etc.)
      - SOLID principles, design patterns, performance optimization
      - Security best practices and comprehensive testing

      ---

      **DECISION FRAMEWORK:**
      
      **STEP 1: Task Analysis**
      Carefully read the task description. Look for these specific indicators:
      - Explicit mention of "imaging-structural MCP server" 
      - Phrases like "available as application [name] via"
      
      **STEP 2: Approach Selection**
      - If ALL structural indicators are present → Use Approach A (verify MCP connectivity first)
      - If NO structural indicators are present → Use Approach B (traditional analysis)
      - When in doubt → Use Approach B (safer fallback)
      
      **STEP 3: Execution**
      Execute your chosen approach without switching unless explicit errors occur.

      **Example Tasks:**
      
      ✅ USE LAYERED (Structural + Traditional): "Analyze shopizer_back_end application 
        (available via imaging-structural MCP server)..."
        → Run MCP structural phases first, then MANDATORY source deep-dive for 
          method signatures, all handler classes, and field-level schema.

      ❌ USE TRADITIONAL ONLY: "Provide architectural overview of the codebase..."
      ❌ USE TRADITIONAL ONLY: "Analyze this Java application for performance improvements"
      ✅ USE LAYERED: "Use CAST Imaging to examine AWSCD application quality insights"
        → MCP for quality/architecture overview, then source search to validate 
          completeness and fill in method/field detail.
      
      Focus on delivering production-ready solutions using the explicitly indicated analysis approach.
    next_step_template: |-
      OBSERVATION:
      {{observation}}
      
      Continue with your chosen approach (structural or traditional), using available analysis capabilities to inform your next steps.
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output. Continue with systematic analysis using your selected approach.
  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
      GIT_PAGER: cat
    propagate_env_variables:
      - "OPENAI_API_KEY"
      - "ANTHROPIC_API_KEY"
      - "IMAGING_X_API_KEY"
      - "IMAGING_MCP_URL"
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
      - path: tools/mcp_client        # MCP tools available but used conditionally
      - path: tools/search            # Traditional search tools
      - path: tools/windowed_edit_linting
    registry_variables:
      USE_FILEMAP: 'true'
      # MCP Configuration (used when available)
      MCP_CONFIG:
        mcpServers:
          # CAST Imaging Structural Analysis Server (optional)
          imaging-structural:
            url: "<your Imaging MCP URL here>"
            headers:
              x-api-key: "<your Imaging API key here>"
            timeout: 300000
            trust: true
      MCP_DEFAULT_SERVER: "imaging-structural"
      MCP_MAX_RETRIES: 3
      SUBMIT_REVIEW_MESSAGES:
        - |
          Excellent work on this adaptive software engineering implementation. Your solution intelligently leverages the best available analysis approach.

          **Final Engineering Review Checklist:**

          1. **Approach Validation**: Confirm you used the optimal analysis approach (structural vs traditional) based on available tools and task requirements.

          2. **Architecture Compliance**: Verify your changes follow established patterns and don't introduce anti-patterns or violations.

          3. **Analysis Quality**: Ensure your chosen approach (structural or traditional) provided sufficient depth of analysis for confident implementation.

          4. **Code Quality**: Confirm implementation meets coding standards including readability, maintainability, performance, security.

          5. **Testing Strategy**: Validate comprehensive test coverage and that existing tests still pass.

          6. **Integration Validation**: Ensure changes work correctly with the broader system without regressions.

          7. **Documentation**: Verify complex logic is documented and any API changes are reflected in documentation.

          8. **Dependency Management**: Confirm changes don't introduce problematic dependencies or architectural coupling.

          9. **Future Maintainability**: Ensure solution is maintainable and follows best practices for long-term evolution.

          10. **Cleanup**: Remove temporary files, debug code, or development artifacts.

          **Layered Analysis Completeness** (when structural analysis was used):
          - [ ] Structural model findings (layers, transactions, quality issues) are documented
          - [ ] ALL service interface methods are enumerated from source — no placeholders like 
                "to be identified in detailed analysis"
          - [ ] Handler class search was performed against source files, not inferred from 
                structural model alone — verify no handlers are missing
          - [ ] Field-level database schema (column names, types, sizes) was read from entity 
                classes or Hibernate mappings, not just table names from structural model
          - [ ] Any gap between structural model coverage and source reality is explicitly noted

          **Implementation Summary:**
          <diff>
          {{diff}}
          </diff>

          Your adaptive approach demonstrates sophisticated engineering judgment, automatically leveraging the best available tools while maintaining professional development standards regardless of the analysis method used.
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: cache_control
      last_n_messages: 2